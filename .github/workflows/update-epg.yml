name: Update EPG Daily

on:
  schedule:
    # Every day at 00:15 Asia/Manila (16:15 UTC previous day)
    - cron: "15 16 * * *"
    # Also refresh mid-day (12:15 Asia/Manila = 04:15 UTC)
    - cron: "15 4 * * *"
  workflow_dispatch:   # manual run button

permissions:
  contents: write

jobs:
  update-epg:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests lxml

      - name: Fetch & merge EPG
        run: python scripts/update_epg.py

      - name: Check for changes
        id: verify
        run: |
          if git diff --quiet epg/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No EPG changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "EPG files updated."
            ls -lh epg/
          fi

      - name: Commit & Push
        if: steps.verify.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add epg/
          git commit -m "chore(epg): auto-update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
